
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="toolbar">
    <input
      type="text"
      id="searchInput"
      placeholder="Search BCA, CSIT... (Esc clear, Enter search)"
    >

    <button id="toggleDetailsBtn" aria-expanded="false">
      Show Details
    </button>
  </div>

  <div id="courseDetails" class="hidden details-box">
    <h2>BCA Details</h2>
    <p>
      Bachelor of Computer Applications focuses on programming,
      software development, databases, and computer applications.
    </p>
  </div>

  <div id="searchGrid" class="grid">

    <div class="card" data-name="BCA" data-tags="app programming">
      <h3>BCA</h3>
      <p>App and programming</p>
    </div>

    <div class="card" data-name="CSIT" data-tags="cs algorithms">
      <h3>CSIT</h3>
      <p>Computer science and algorithms</p>
    </div>

    <div class="card" data-name="BIT" data-tags="it networking">
      <h3>BIT</h3>
      <p>IT and networking</p>
    </div>

    <div class="card" data-name="BIM" data-tags="management">
      <h3>BIM</h3>
      <p>Information management</p>
    </div>

  </div>

  <div id="searchStatus"></div>

  <label for="nameInput">Name:</label>
  <input
    type="text"
    id="nameInput"
    placeholder="Type name"
  >

  <p>
    Characters: <span id="charCount">0</span> |
    Trimmed: <span id="trimCount">0</span>
  </p>

  <script src="script.js"></script>
</body>
</html>
